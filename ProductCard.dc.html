<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:#fff; border:1px solid #EAE7E0; border-radius:18px; overflow:hidden; display:flex; flex-direction:column; transition:box-shadow .3s ease, transform .3s ease;" style-hover="box-shadow:0 24px 44px -26px rgba(0,0,0,.3); transform:translateY(-4px);">
  <div style="position:relative;">
    <div onClick="{{ open }}" style="cursor:pointer; aspect-ratio:1/1; overflow:hidden; background:#fff; display:flex; align-items:center; justify-content:center; padding:18px;">
      <img src="{{ p.img }}" alt="{{ p.name }}" style="max-width:100%; max-height:100%; object-fit:contain; mix-blend-mode:multiply;">
    </div>
    <sc-if value="{{ p.badge }}" hint-placeholder-val="{{ false }}">
      <span style="position:absolute; top:12px; inset-inline-start:12px; background:#1B1B1D; color:#fff; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; padding:5px 11px; border-radius:999px;">{{ p.badge }}</span>
    </sc-if>
    <button onClick="{{ save }}" aria-label="save" style="position:absolute; top:10px; inset-inline-end:10px; width:36px; height:36px; border-radius:999px; border:none; background:rgba(255,255,255,.9); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; cursor:pointer;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="{{ heartFill }}" stroke="{{ heartStroke }}" stroke-width="1.7"><path d="M20.8 5.6a5.4 5.4 0 0 0-7.7 0l-1.1 1.1-1.1-1.1a5.4 5.4 0 1 0-7.7 7.7l1.1 1.1L12 21l7.7-7.6 1.1-1.1a5.4 5.4 0 0 0 0-7.7z"/></svg>
    </button>
  </div>
  <div style="padding:18px 18px 20px; display:flex; flex-direction:column; flex:1;">
    <span style="font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:#8A867D; margin-bottom:6px;">{{ p.catLabel }}</span>
    <h3 onClick="{{ open }}" style="cursor:pointer; font-weight:600; font-size:17px; line-height:1.25; color:#1B1B1D;">{{ p.name }}</h3>
    <p style="font-size:13px; line-height:1.5; color:#8A867D; margin-top:5px; flex:1;">{{ p.tagline }}</p>
    <div style="display:flex; align-items:center; gap:6px; margin-top:10px;">
      <span style="color:#C9A24B; font-size:12px; letter-spacing:1px;">★★★★★</span>
      <span style="font-size:12px; color:#8A867D;">{{ p.rating }} · {{ p.reviews }}</span>
    </div>
    <div style="display:flex; align-items:center; justify-content:space-between; margin-top:14px;">
      <div style="display:flex; align-items:baseline; gap:8px;">
        <span style="font-size:19px; font-weight:600; color:#1B1B1D;">{{ p.priceLabel }}</span>
        <sc-if value="{{ p.compareLabel }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px; color:#A9A59C; text-decoration:line-through;">{{ p.compareLabel }}</span></sc-if>
      </div>
      <button onClick="{{ add }}" aria-label="add" style="cursor:pointer; background:#1B1B1D; color:#fff; border:none; border-radius:999px; width:38px; height:38px; font-size:20px; line-height:1; display:flex; align-items:center; justify-content:center;" style-hover="background:#3A3A40;">+</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:280,&quot;height&quot;:440},&quot;p&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;onAdd&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id:string)=&gt;void&quot;},&quot;onOpen&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id:string)=&gt;void&quot;},&quot;onSave&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id:string)=&gt;void&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props.p || {};
    const onAdd = this.props.onAdd, onOpen = this.props.onOpen, onSave = this.props.onSave;
    return {
      p,
      heartFill: p.saved ? '#1B1B1D' : 'none',
      heartStroke: p.saved ? '#1B1B1D' : '#3A3A40',
      add: (e) => { if(e&&e.stopPropagation) e.stopPropagation(); if(onAdd) onAdd(p.id); },
      save: (e) => { if(e&&e.stopPropagation) e.stopPropagation(); if(onSave) onSave(p.id); },
      open: () => { if(onOpen) onOpen(p.id); },
    };
  }
}
</script>
</body>
</html>
